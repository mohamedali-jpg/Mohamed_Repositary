[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "questionnaire-simulator"
version = "0.1.0"
description = "Simulate a population of respondents answering a questionnaire"
requires-python = ">=3.9"

[project.scripts]
qsim = "qsim.cli:main"

[tool.setuptools]
packages = ["qsim"]
